<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Личный список задач с сохранением в браузере.">
    <meta name="theme-color" content="#f5f1ea">
    <title>Список задач</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="./assets/manrope.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="workspace">
      <section class="tasks" aria-labelledby="page-title">
        <h1 id="page-title">Список задач</h1>

        <form class="task-form" id="task-form" novalidate>
          <div class="task-compose-line">
            <div class="task-compose-field">
              <label class="sr-only" for="task-input">Новая задача</label>
              <input id="task-input" name="title" type="text" placeholder="Новая задача" required autocomplete="off">
              <button class="icon-button deadline-toggle" id="toggle-task-deadline" type="button" aria-label="Указать срок" aria-expanded="false" aria-controls="task-deadline-controls" title="Указать срок">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3.5" y="5.5" width="17" height="15" rx="2"/>
                  <path d="M7.5 3.5v4m9-4v4m-13 3h17"/>
                  <path class="deadline-plus" d="M12 12.7v5.6m-2.8-2.8h5.6"/>
                  <path class="deadline-tick" d="m9.3 15.4 1.9 1.9 3.5-3.6"/>
                </svg>
              </button>
              <div class="deadline-panel" id="task-deadline-controls" hidden>
                <label for="task-deadline">Срок задачи</label>
                <div class="deadline-panel-controls">
                  <input class="date-input" id="task-deadline" name="deadline" type="date" max="9999-12-31">
                  <button class="text-button" id="finish-task-deadline" type="button">Готово</button>
                </div>
              </div>
            </div>
            <button class="add-button" type="submit">Добавить</button>
          </div>
          <div class="draft-deadline" id="draft-deadline" hidden>
            <time id="draft-deadline-date"></time>
            <button class="icon-button" id="clear-task-deadline" type="button" aria-label="Убрать срок новой задачи" title="Убрать срок">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <path d="m6 6 12 12M18 6 6 18"/>
              </svg>
            </button>
          </div>
        </form>

        <div class="task-toolbar">
          <p class="task-count" id="task-count"></p>
          <div class="task-view-controls">
            <label class="sr-only" for="task-filter">Статус задач</label>
            <select id="task-filter">
              <option value="all">Все задачи</option>
              <option value="active">Активные</option>
              <option value="completed">Выполненные</option>
            </select>

            <label class="sr-only" for="task-sort">Порядок задач</label>
            <select id="task-sort">
              <option value="oldest">Сначала старые</option>
              <option value="newest">Сначала новые</option>
              <option value="deadline">По ближайшему сроку</option>
            </select>
          </div>
        </div>

        <p class="empty-state" id="empty-state">Задач пока нет</p>
        <ul class="task-list" id="task-list" aria-label="Задачи"></ul>
        <p class="storage-warning" id="storage-warning" role="status" hidden>Не удалось сохранить задачи в этом браузере.</p>
      </section>

      <figure class="workspace-photo" aria-hidden="true">
        <img src="./assets/notebook.webp" alt="" width="960" height="1200" fetchpriority="high">
      </figure>
    </main>

    <div class="sr-only" id="task-status" role="status"></div>
    <div class="undo-notice" id="undo-notice" aria-label="Удаление задачи" role="group" hidden>
      <span>Задача удалена</span>
      <button class="text-button" id="undo-delete" type="button">Отменить</button>
      <button class="icon-button" id="dismiss-undo" type="button" aria-label="Закрыть уведомление">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>

    <dialog class="task-editor" id="task-editor" aria-labelledby="edit-heading">
      <form id="edit-form" novalidate>
        <h2 id="edit-heading">Редактировать задачу</h2>
        <label class="editor-label" for="edit-title">Название</label>
        <input class="editor-title" id="edit-title" name="title" type="text" required autocomplete="off" autofocus>
        <div class="editor-date-entry">
          <label for="edit-deadline">Срок</label>
          <input class="date-input" id="edit-deadline" name="deadline" type="date" max="9999-12-31">
          <button class="text-button" id="clear-edit-deadline" type="button" hidden>Убрать срок</button>
        </div>
        <div class="editor-actions">
          <button class="editor-cancel" id="cancel-edit" type="button">Отмена</button>
          <button class="editor-save" type="submit">Сохранить</button>
        </div>
      </form>
    </dialog>

    <template id="task-template">
      <li class="task-row">
        <div class="task-row-body">
          <label class="task-label">
            <input class="task-checkbox" type="checkbox">
            <span class="task-check" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path pathLength="1" d="m4 10 4 4 8-8"/>
              </svg>
            </span>
            <span class="task-copy">
              <span class="task-title"></span>
              <time class="task-deadline" hidden></time>
            </span>
          </label>
          <div class="task-actions">
            <button class="icon-button edit-button" type="button" aria-label="Редактировать задачу">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m14.5 5.5 4 4M4 20l4.6-1L20 7.6a1.6 1.6 0 0 0 0-2.3l-1.3-1.4a1.6 1.6 0 0 0-2.3 0L5 15.4 4 20Z"/>
              </svg>
            </button>
            <button class="icon-button delete-button" type="button" aria-label="Удалить задачу">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 5.5h18M9 5.5V3.75A1.75 1.75 0 0 1 10.75 2h2.5A1.75 1.75 0 0 1 15 3.75V5.5M5.5 5.5l.9 14.1A1.5 1.5 0 0 0 7.9 21h8.2a1.5 1.5 0 0 0 1.5-1.4l.9-14.1M10 9v8m4-8v8"/>
              </svg>
            </button>
          </div>
        </div>
      </li>
    </template>
  </body>
</html>
